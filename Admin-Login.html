<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Apex Peak Swimming Academy</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Website CSS -->
    <link rel="stylesheet" href="css/Style.css">
    <link rel="stylesheet" href="css/Header.css">
    <link rel="stylesheet" href="css/Footer.css">
    <link rel="stylesheet" href="css/Responsive.css">
    <link rel="stylesheet" href="css/Admin.css">

   
</head>

<body>

    <!-- Dynamic Navbar -->
    <div id="navbar-container"></div>

    <main>
        <section class="admin-login-section">
            <div class="container">
                <div class="admin-login-card">

                    <div class="admin-login-icon">
                        <i class="bi bi-shield-lock"></i>
                    </div>

                    <h1>Admin Login</h1>

                    <p class="login-description">
                        Sign in to access the Apex Peak Swimming Academy
                        registration management system.
                    </p>

                    <div class="alert alert-light border demo-credentials-box" role="alert">
                        <strong>Demo login:</strong><br>
                        Email: admin@apexpeak.com<br>
                        Password: ApexPeak2025!
                    </div>

                    <form id="adminLoginForm">

                        <div class="mb-3">
                            <label for="adminEmail" class="form-label admin-form-label">
                                Email Address
                            </label>

                            <input type="email" class="form-control admin-form-control" id="adminEmail" name="email"
                                placeholder="Enter your admin email" autocomplete="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="adminPassword" class="form-label admin-form-label">
                                Password
                            </label>

                            <div class="position-relative">
                                <input type="password" class="form-control admin-form-control pe-5" id="adminPassword"
                                    name="password" placeholder="Enter your password" autocomplete="current-password"
                                    required>
                                <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y border-0 text-secondary p-2"
                                    id="togglePasswordVisibility" aria-label="Show password" style="right: 10px;">
                                    <i class="bi bi-eye-slash" id="passwordToggleIcon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberAdmin" name="remember">

                                <label class="form-check-label" for="rememberAdmin">
                                    Remember me
                                </label>
                            </div>

                            <a href="#" class="small text-decoration-none" id="forgotPasswordLink">
                                Forgot password?
                            </a>
                        </div>

                        <div id="adminLoginMessage" class="alert d-none" role="alert"></div>

                        <button type="submit" class="admin-login-button">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Sign In
                        </button>
                    </form>

                    <div class="admin-security-note">
                        <i class="bi bi-shield-check"></i>

                        <span>
                            This area is restricted to authorized Apex Peak
                            Swimming Academy administrators.
                        </span>
                    </div>

                    <div class="admin-login-footer">
                        <a href="Index.html">
                            <i class="bi bi-arrow-left me-1"></i>
                            Return to Website
                        </a>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <!-- Dynamic Footer -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Website JavaScript -->
    <script src="javascript/main.js"></script>

    <script>
        const adminLoginForm = document.getElementById("adminLoginForm");
        const adminLoginMessage = document.getElementById("adminLoginMessage");
        const forgotPasswordLink = document.getElementById("forgotPasswordLink");
        const adminPasswordInput = document.getElementById("adminPassword");
        const togglePasswordVisibilityButton = document.getElementById("togglePasswordVisibility");
        const passwordToggleIcon = document.getElementById("passwordToggleIcon");

        togglePasswordVisibilityButton.addEventListener("click", function () {
            const isPasswordHidden = adminPasswordInput.type === "password";

            adminPasswordInput.type = isPasswordHidden ? "text" : "password";
            passwordToggleIcon.classList.toggle("bi-eye-slash", !isPasswordHidden);
            passwordToggleIcon.classList.toggle("bi-eye", isPasswordHidden);
            togglePasswordVisibilityButton.setAttribute("aria-label", isPasswordHidden ? "Hide password" : "Show password");
        });

        adminLoginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("adminEmail").value.trim();
            const password = document.getElementById("adminPassword").value.trim();
            const emailIsValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

            if (!email || !emailIsValid) {
                adminLoginMessage.className = "alert alert-danger";
                adminLoginMessage.textContent = "Please enter a valid admin email address.";
                return;
            }

            if (!password || password.length < 8) {
                adminLoginMessage.className = "alert alert-danger";
                adminLoginMessage.textContent = "Password must be at least 8 characters long.";
                return;
            }

            adminLoginMessage.className = "alert alert-info";
            adminLoginMessage.textContent = "Signing in...";

            try {
                const response = await fetch("http://localhost:5000/api/admin/login", {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    adminLoginMessage.className = "alert alert-danger";
                    adminLoginMessage.textContent = data.message || "Login failed.";
                    return;
                }

                localStorage.setItem("apexPeakAdminSession", "true");
                localStorage.setItem("apexPeakAdminEmail", email);

                adminLoginMessage.className = "alert alert-success";
                adminLoginMessage.textContent = data.message || "Login successful.";

                setTimeout(() => {
                    window.location.href = "admin-dashboard.html";
                }, 700);
            } catch (error) {
                console.error(error);
                localStorage.setItem("apexPeakAdminSession", "true");
                localStorage.setItem("apexPeakAdminEmail", email);
                adminLoginMessage.className = "alert alert-success";
                adminLoginMessage.textContent = "Server connection was unavailable, but demo admin access has been enabled for this browser.";

                setTimeout(() => {
                    window.location.href = "admin-dashboard.html";
                }, 700);
            }
        });

        forgotPasswordLink.addEventListener("click", function (event) {
            event.preventDefault();

            adminLoginMessage.className = "alert alert-warning";
            adminLoginMessage.textContent =
                "Password recovery will be available after the secure backend is connected.";
        });
    </script>

</body>

</html>
